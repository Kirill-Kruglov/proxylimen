[project]
name = "proxylimen"
version = "0.1.0"
description = "Deriving world-structure from minimal contact: tiny worlds, a self-checking gate harness, and the walls where blind derivation breaks"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# the repo has many top-level dirs (experiments/, docs/, essay/, ...);
# only gate_harness is the installable package
packages = ["gate_harness", "gate_harness.tests"]

[tool.pytest.ini_options]
testpaths = ["gate_harness/tests"]
