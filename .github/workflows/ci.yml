name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest numpy
      - run: pytest -q
      - name: Verify the citability split (5 VALID, superseded INVALID)
        run: python scripts/verify_all.py
      - name: Estimator fit path never reads seed_id (AST scan)
        run: python scripts/check_learner_view_hygiene.py
